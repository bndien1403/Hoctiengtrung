<head>

<title>Hán Ngữ Cùng Nhau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<style>
/* Layout: vở luyện chữ trên điện thoại – thẻ học kẻ ô 田字格, mực xanh ngọc, dấu triện son, thanh điệu tô màu */
:root {
  --paper: #f3f6f4;
  --surface: #ffffff;
  --surface-2: #e9efec;
  --ink: #15201c;
  --muted: #5b6a64;
  --line: #d6dfdb;
  --jade: #0b7a5e;
  --jade-ink: #ffffff;
  --jade-soft: #dcefe8;
  --seal: #c0392b;
  --seal-soft: #f7e0dc;
  --gold: #a87a12;
  --gold-soft: #f5ead0;
  --t1: #d33a2c; --t2: #d97706; --t3: #15803d; --t4: #2563c9; --t5: #7c8783;
  --shadow: 0 1px 2px rgba(15, 40, 32, .06), 0 6px 20px rgba(15, 40, 32, .06);
  --f-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-han: "Noto Serif SC", "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1412; --surface: #151f1c; --surface-2: #1c2925; --ink: #e3ece8; --muted: #93a39c; --line: #283632;
    --jade: #35b98f; --jade-ink: #06120e; --jade-soft: #15362c; --seal: #ef6a55; --seal-soft: #3a1d18; --gold: #e0b44c; --gold-soft: #3a2f14;
    --t1: #ff6b5e; --t2: #ffa53d; --t3: #4fd082; --t4: #73a7ff; --t5: #8c9893;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1412; --surface: #151f1c; --surface-2: #1c2925; --ink: #e3ece8; --muted: #93a39c; --line: #283632;
  --jade: #35b98f; --jade-ink: #06120e; --jade-soft: #15362c; --seal: #ef6a55; --seal-soft: #3a1d18; --gold: #e0b44c; --gold-soft: #3a2f14;
  --t1: #ff6b5e; --t2: #ffa53d; --t3: #4fd082; --t4: #73a7ff; --t5: #8c9893;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-ui); margin: 0; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.han { font-family: var(--f-han); font-weight: 500; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 54px; padding-block: 6px; }
.mark { width: 34px; height: 34px; border-radius: 7px; background: var(--seal); color: #fff; display: grid; place-items: center; font-family: var(--f-han); font-weight: 900; font-size: 20px; flex: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.top-title { font-weight: 800; font-size: 16px; line-height: 1.15; }
.top-sub { font-size: 12px; color: var(--muted); }
.back { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--surface-2); white-space: nowrap; }
.pill.fire { background: var(--seal-soft); color: var(--seal); }
.pill.xp { background: var(--gold-soft); color: var(--gold); }
.pill.jade { background: var(--jade-soft); color: var(--jade); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; border: 0; flex: none; }
.avatar.sm { width: 28px; height: 28px; font-size: 16px; }
.avatar.lg { width: 56px; height: 56px; font-size: 30px; }

/* ---------- main & tabs ---------- */
main { padding-block: 16px calc(92px + env(safe-area-inset-bottom, 0px)); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: none; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 11.5px; font-weight: 600; position: relative; }
.tab .ti { font-family: var(--f-han); font-size: 19px; font-weight: 700; line-height: 1.2; }
.tab.on { color: var(--jade); }
.tab.on .ti { color: var(--jade); }
.tab .dot { position: absolute; top: 6px; right: calc(50% - 20px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--seal); color: #fff; font-size: 10px; line-height: 16px; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card.flat { box-shadow: none; }
.card.hero { box-shadow: var(--shadow); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; background: none; width: 100%; text-align: left; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .lt { font-weight: 600; }
.li .chev { color: var(--muted); font-size: 18px; }
.li-ic { width: 40px; height: 40px; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-han); font-size: 20px; font-weight: 700; flex: none; color: var(--jade); }
.li-ic.done { background: var(--jade); color: var(--jade-ink); }
.li-ic.cur { background: var(--seal); color: #fff; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.link { border: 0; background: none; color: var(--jade); font-weight: 700; padding: 4px 0; }

/* ---------- buttons ---------- */
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--surface-2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; }
.btn.primary { background: var(--jade); color: var(--jade-ink); }
.btn.seal { background: var(--seal); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.block { width: 100%; }
a.btn { text-decoration: none; }
.btn.sm { min-height: 36px; padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 18px; flex: none; }
.icon-btn.jade { background: var(--jade-soft); color: var(--jade); }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 6px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 13px; font-size: 16px; }
.masked { -webkit-text-security: disc; text-security: disc; }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 52px; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 40px; border: 0; background: transparent; font-size: 18px; border-radius: 10px; }
.input:focus { outline: 2px solid var(--jade); outline-offset: 0; border-color: transparent; }

/* ---------- home ---------- */
.hello { display: flex; align-items: center; gap: 14px; }
.goal { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .rv { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .rv b { font-size: 24px; line-height: 1; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.continue { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; position: relative; }
.bar { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.bar i { display: block; width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--jade-soft); min-height: 3px; }
.bar.today i { background: var(--jade); }
.bar.met i { background: var(--jade); opacity: .75; }
.bar span { font-size: 11px; color: var(--muted); }
.goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--seal); opacity: .6; }
.modules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mod { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.mod .mz { font-family: var(--f-han); font-size: 26px; font-weight: 700; color: var(--jade); line-height: 1.2; }
.mod .mt { font-size: 13px; font-weight: 700; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- characters / tiánzìgé ---------- */
.tzg { position: relative; aspect-ratio: 1; max-width: 100%; background: var(--surface); border: 2px solid var(--seal); border-radius: 6px; }
.tzg::before, .tzg::after { content: ""; position: absolute; pointer-events: none; }
.tzg::before { left: 50%; top: 0; bottom: 0; border-left: 1px dashed color-mix(in srgb, var(--seal) 55%, transparent); }
.tzg::after { top: 50%; left: 0; right: 0; border-top: 1px dashed color-mix(in srgb, var(--seal) 55%, transparent); }
.tzg .diag { position: absolute; inset: 0; pointer-events: none; }
.tzg .diag line { stroke: var(--seal); stroke-opacity: .28; stroke-dasharray: 4 5; stroke-width: 1; }
.tzg .glyph { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-han); font-weight: 500; line-height: 1; }
.tzg .hw { position: absolute; inset: 0; }
.tzg .hw svg { width: 100%; height: 100%; }
.big-han { font-family: var(--f-han); font-weight: 500; line-height: 1.1; }
.py { font-weight: 600; letter-spacing: .01em; }
.tone1 { color: var(--t1); } .tone2 { color: var(--t2); } .tone3 { color: var(--t3); } .tone4 { color: var(--t4); } .tone5 { color: var(--t5); }
.hv { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--seal); }
.ruby { font-family: var(--f-han); font-size: 22px; line-height: 2.2; display: flex; flex-wrap: wrap; column-gap: 4px; align-items: flex-end; }
.ruby ruby { ruby-position: over; }
.ruby rt { font-family: var(--f-ui); font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .01em; }
.hide-py rt { visibility: hidden; }
.hide-han .ruby ruby > .rb { visibility: hidden; }
.hide-vi .vi-line { visibility: hidden; }
.ruby .key { color: var(--seal); }
.ruby.sm { font-size: 18px; }
.ex { display: flex; gap: 10px; align-items: flex-start; }
.wordcard { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.wordcard .big-han { font-size: 72px; }
.emoji { font-size: 34px; line-height: 1; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.tag.lv { background: var(--jade-soft); color: var(--jade); }
.vocab-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.vocab-row:first-child { border-top: 0; }
.vocab-row .han { font-size: 26px; text-align: center; }
.vocab-row .meta { min-width: 0; }
.vocab-row .meta p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.state-dot.learn { background: var(--gold); }
.state-dot.known { background: var(--jade); }
.state-dot.weak { background: var(--seal); }
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.char-cell { aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-family: var(--f-han); font-size: 26px; display: grid; place-items: center; }
.comp { display: flex; gap: 10px; flex-wrap: wrap; }
.comp button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; display: flex; gap: 8px; align-items: center; text-align: left; }
.comp .han { font-size: 26px; }

/* ---------- quiz ---------- */
.quiz-top { display: flex; align-items: center; gap: 12px; }
.progress { flex: 1; height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--jade); border-radius: 6px; transition: width .3s ease; }
.q-prompt { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-block: 8px; }
.q-prompt .big-han { font-size: 60px; }
.q-prompt .vi-big { font-size: 22px; font-weight: 700; }
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; text-align: center; font-weight: 600; min-height: 56px; }
.opt .han { font-size: 28px; }
.opt.sel { border-color: var(--jade); background: var(--jade-soft); }
.opt.right { border-color: var(--jade); background: var(--jade-soft); }
.opt.wrong { border-color: var(--seal); background: var(--seal-soft); }
.opt.hear { position: relative; cursor: pointer; }
.opt .opt-han { display: block; font-size: 18px; margin-top: 4px; color: var(--ink); opacity: .85; }
.opt .opt-snd { position: absolute; top: 6px; right: 8px; font-size: 13px; opacity: .7; }
.q-snd { font-size: 18px; }
.progress.sm { height: 6px; display: block; }
.dq-row { align-items: center; }
.dq-row.ok { opacity: .75; }
.dq-row .lt { display: block; }
.dq-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; min-width: 56px; }
.dq-chest { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); gap: 8px; flex-wrap: wrap; }
.dq-chest.open { background: var(--jade-soft); }
.duel-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.duel-r .win { color: var(--gold); font-weight: 700; }
.duel-call { border-color: var(--seal); background: var(--seal-soft); }
.duel-vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.duel-vs .vs { font-weight: 900; color: var(--seal); font-size: 18px; }
.duel-side { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px; border-radius: 14px; background: var(--surface-2); text-align: center; min-width: 0; }
.duel-side.win { background: var(--jade-soft); outline: 2px solid var(--jade); }
.duel-score { font-size: 34px; font-weight: 800; line-height: 1.1; }
.tzg .hw, #pad-cv { touch-action: none; -webkit-user-select: none; user-select: none; }
.steps3 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.steps3 b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--jade); color: var(--jade-ink, #fff); font-size: 12px; margin-right: 2px; }
.ws-stages button b { color: var(--jade); }
.ws-msg { min-height: 2.6em; text-align: center; margin: 0; }
.ws-act { justify-content: center; }
.ws-word { display: flex; justify-content: center; gap: 6px; font-size: 40px; line-height: 1.2; }
.ws-word .cur { color: var(--seal); border-bottom: 3px solid var(--seal); min-width: 1em; text-align: center; }
.ws-word .cur.ok { color: var(--jade); border-color: var(--jade); }
.ws-word .todo { color: var(--muted); }
.stroke-chart { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.sc-cell { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.sc-grid { stroke: var(--seal); stroke-opacity: .25; stroke-width: 10; stroke-dasharray: 30 30; fill: none; }
.sc-done { fill: var(--ink); }
.sc-cur { fill: var(--seal); }
.sc-todo { fill: var(--line); }
.sc-n { font-size: 190px; font-weight: 700; fill: var(--muted); font-family: var(--f-ui, sans-serif); }
.sg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sg-card { display: flex; flex-direction: column; gap: 4px; padding: 12px; }
.sg-demo { display: grid; place-items: center; min-height: 100px; background: var(--surface-2); border-radius: 10px; padding: 6px; }
.sd-other { fill: var(--line); }
.sd-base { fill: color-mix(in srgb, var(--seal) 18%, transparent); }
.sd-anim { fill: none; stroke: var(--seal); stroke-width: 210; stroke-linecap: round; stroke-linejoin: round; animation: sdraw 2.4s ease-in-out infinite; }
@keyframes sdraw { 0% { stroke-dashoffset: var(--len); } 55% { stroke-dashoffset: 0; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
.sr-row { align-items: flex-start; }
.sr-demo { width: 80px; height: 80px; flex: none; border: 1.5px solid var(--seal); border-radius: 6px; background: var(--surface); padding: 0; position: relative; background-image: linear-gradient(to right, transparent calc(50% - .5px), color-mix(in srgb, var(--seal) 30%, transparent) 50%, transparent calc(50% + .5px)), linear-gradient(to bottom, transparent calc(50% - .5px), color-mix(in srgb, var(--seal) 30%, transparent) 50%, transparent calc(50% + .5px)); }

/* ================= lặp lại ngắt quãng (SRS) ================= */
// thẻ = [ngày đến hạn, khoảng (ngày), độ dễ ×100, số lần nhớ, số lần quên, cờ] — cờ: 1 = đã lưu, 2 = đánh dấu đã thuộc
const SRS = {
  add(s, dueIn = 1) { if (!S.srs[s]) { S.srs[s] = [dayNum() + dueIn, 0, 250, 0, 0, 0]; saveSrs(); return true; } return false; },

    else if (g === 1) { ivl = Math.max(1, Math.round(Math.max(ivl, 1) * 1.2)); ease = Math.max(130, ease - 15); reps++; due = t + ivl; }

  weak() { return Object.entries(S.srs).filter(([, c]) => c[4] >= 2 && !(c[5] & 2)).sort((a, b) => b[1][4] - a[1][4]).map(x => x[0]); },

};

const TTS = {

  voices: [], unlocked: false, token: 0,
  init() {

    load(); try { speechSynthesis.addEventListener('voiceschanged', load); } catch { speechSynthesis.onvoiceschanged = load; }
  },
  list(lang) { const pre = lang === 'zh' ? ['zh-cn', 'zh_cn', 'cmn'] : ['vi']; return this.voices.filter(v => pre.some(p => v.lang.toLowerCase().replace('_', '-').startsWith(p.replace('_', '-')))); },
  voice(lang) {
    const pref = S.P && S.P.settings['voice_' + lang];
    const list = this.list(lang);
    return list.find(v => v.voiceURI === pref) || list.find(v => /natural|online|google/i.test(v.name)) || list[0] || (lang === 'zh' ? this.voices.find(v => v.lang.toLowerCase().startsWith('zh')) : null) || null;
  },
  hasZh() { return !this.voices.length || this.list('zh').length > 0 || this.voices.some(v => v.lang.toLowerCase().startsWith('zh')); },
  unlock() { if (!this.ok || this.unlocked) return; this.unlocked = true; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch { } },
  stop() { if (!this.ok) return; this.token++; try { speechSynthesis.cancel(); } catch { } },
  async speak(text, { lang = 'zh', rate, pitch = 1, onstart } = {}) {
    if (!this.ok || !text) return;
    this.stop(); await sleep(30);
    const my = ++this.token;
    const r = rate ?? (S.P ? S.P.settings.rate : .85);
    const parts = String(text).split(/(?<=[。！？；!?;\n])/).map(s => s.trim()).filter(Boolean);
    for (const part of parts) {
      if (my !== this.token) return;
      await new Promise(res => {
        let done = false; const fin = () => { if (!done) { done = true; res(); } };
        try {
          const u = new SpeechSynthesisUtterance(part);
          u.lang = lang === 'zh' ? 'zh-CN' : 'vi-VN';
          const v = this.voice(lang); if (v) u.voice = v;
          u.rate = clamp(lang === 'vi' ? Math.max(r, .95) : r, .4, 1.5); u.pitch = pitch;
          u.onstart = () => onstart && onstart();
          u.onend = fin; u.onerror = fin;
          speechSynthesis.speak(u);
          setTimeout(fin, 2500 + part.length * (lang === 'zh' ? 450 : 160) / u.rate);
        } catch { fin(); }
      });
    }
  },
};

async function doLogin(u, pin) {
  if (Date.now() < pinLock) { authErr = 'Nhập sai quá nhiều lần. Đợi 30 giây rồi thử lại.'; return render(); }
  const a = S.accounts[u]; if (!a) return;
  const h = await sha(a.salt + ':' + pin);
  if (h !== a.pin) { pinTries++; if (pinTries >= 5) { pinLock = Date.now() + 30000; pinTries = 0; } authErr = 'Mã PIN chưa đúng.'; return render(); }
  pinTries = 0; authErr = '';
  LS.set('session', { u, k: a.pin });
  if (S.cid && !a.cid && S.cap.db) { try { await S.cap.db.doc('accounts/' + u).update({ cid: S.cid }); } catch { } }
  await enterAs(u);
}
async function doRegister(name, u, pin) {
  name = name.trim().slice(0, 24); u = u.trim().toLowerCase();
  if (!/^[a-z0-9_]{3,16}$/.test(u)) { authErr = 'Tên đăng nhập gồm 3–16 ký tự: chữ thường không dấu, số hoặc gạch dưới.'; return render(); }
  if (!/^\d{4,6}$/.test(pin)) { authErr = 'Mã PIN gồm 4 đến 6 chữ số.'; return render(); }
  if (!name) { authErr = 'Hãy nhập tên hiển thị.'; return render(); }
  if (Object.keys(S.accounts).length >= MAX_MEMBERS) { authErr = `Nhóm đã đủ ${MAX_MEMBERS} người.`; return render(); }
  const salt = randId(8); const ph = await sha(salt + ':' + pin);
  const acc = { name, av: authAv, salt, pin: ph, created: Date.now(), cid: S.cid || null };
  if (S.local) { S.accounts[u] = acc; LS.set('localAccounts', S.accounts); }
  else {
    const ref = S.cap.db.doc('accounts/' + u);
    try {
      const lease = await ref.acquire({ holder: randId(), ttlMs: 6000 });
      if (!lease.acquired) { authErr = 'Tên này đang được người khác tạo. Chọn tên khác.'; return render(); }
      const snap = await ref.get();
      if (snap.exists && snap.data() && snap.data().pin) { authErr = 'Tên đăng nhập đã có người dùng.'; return render(); }
      await ref.set(acc);
    } catch (e) {
      console.warn(e);
      authErr = e && e.code === 'invalid_argument' ? 'Tài khoản claude.ai của bạn chưa có quyền ghi dữ liệu nhóm. Nhờ chủ nhóm mời bạn với quyền Chỉnh sửa (Editor).' : 'Không tạo được tài khoản lúc này. Thử lại sau ít phút.';
      return render();
    }
    S.accounts[u] = acc;
  }
  LS.set('session', { u, k: ph });
  await enterAs(u, true);
}

function poolFor(w) { const p = BYLV[w.lv] || []; return p.length > 8 ? p : [...BYLV[1], ...BYLV[2]]; }

  const tryAdd = arr => { for (const x of arr) { if (out.length >= n) break; if (x.s === w.s || used.has(x[field]) || !x[field]) continue; used.add(x[field]); out.push(x); } };
  tryAdd(shuffle(pool.filter(x => x.pos === w.pos && [...x.s].length === [...w.s].length)));
  tryAdd(shuffle(pool.filter(x => x.pos === w.pos)));
  tryAdd(shuffle(pool));
  return out;
}
function hanPrompt(w, play = true) { return `<div class="big-han">${toneHan(w.s, w.tn)}</div>${play ? playBtn(w.s, 'sm ghost') : ''}`; }

function qListen(w) { const o = shuffle([w, ...distractors(w, 's')]); return { type: 'mcq', ask: 'Nghe và chọn từ đúng', prompt: `<button class="play" data-act="say" data-t="${esc(w.s)}" aria-label="Nghe lại">🔊</button>`, say: w.s, opts: o.map(x => ({ v: x.s, h: `<span class="han">${esc(x.s)}</span>` })), a: w.s, two: true, w, explain: `<b class="han">${esc(w.s)}</b> ${esc(w.py)} – ${esc(w.vi)}` }; }
function qPinyin(w) { const vs = shuffle(pyVariants(w.py)).slice(0, 3); if (vs.length < 2) return null; const o = shuffle([w.py, ...vs]); return { type: 'mcq', ask: 'Chọn pinyin đúng (chú ý thanh điệu)', prompt: `<div class="big-han">${esc(w.s)}</div><p class="muted">${esc(w.vi)}</p>`, opts: o.map(p => ({ v: p, h: `<span class="py" style="font-size:18px">${esc(p)}</span>` })), a: w.py, two: true, w, sayAfter: w.s, explain: `<b class="han">${esc(w.s)}</b> đọc là <b>${esc(w.py)}</b>` }; }

  const toks = []; const tail = [];

}
function qFill(ex, keyIdx, distract) {
  const key = ex.w[keyIdx]; const o = shuffle([key, ...shuffle(distract.filter(x => x !== key)).slice(0, 3)]);
  const w = ex.w.slice(); const p = ex.p.slice(); w[keyIdx] = '＿＿'; p[keyIdx] = '';
  return { type: 'mcq', ask: 'Chọn từ điền vào chỗ trống', prompt: `${rubyHTML(w, p)}<p class="muted">${esc(ex.vi)}</p>`, opts: o.map(x => ({ v: x, h: `<span class="han">${esc(x)}</span>` })), a: key, two: true, sayAfter: ex.w.join(''), explain: rubyHTML(ex.w, ex.p, keyIdx, 'sm') };

function qSentMeaning(ex, others) {
  const o = shuffle([ex.vi, ...shuffle(others.filter(v => v !== ex.vi)).slice(0, 3)]);
  return { type: 'mcq', ask: 'Nghe câu và chọn nghĩa đúng', prompt: `<button class="play" data-act="say" data-t="${esc(ex.w.join(''))}">🔊</button><div class="small muted">Chạm để nghe lại</div>`, say: ex.w.join(''), opts: o.map(v => ({ v, h: esc(v) })), a: ex.vi, explain: rubyHTML(ex.w, ex.p, -1, 'sm') };

function qTranslate(ex) { return { type: 'type', vi: ex.vi, ans: ex.w.filter(t => !isPunct(t)).join(''), ex }; }
function anyQ(w, kinds = ['meaning', 'hanzi', 'listen', 'pinyin']) {
  const k = kinds[Math.floor(Math.random() * kinds.length)];
  return (k === 'pinyin' && qPinyin(w)) || (k === 'hanzi' && qHanzi(w)) || (k === 'listen' && TTS.ok && qListen(w)) || qMeaning(w);
}
function vocabLessonQs(ws) {
  const qs = [];
  for (const part of [ws.slice(0, 5), ws.slice(5)]) {
    if (!part.length) continue;

function grammarQs(g) {

  for (const ex of g.ex) if (ex.k >= 0) qs.push(qFill(ex, ex.k, keys));

function toneSVG(shape, n) {
  const pts = shape === 'ngắn' ? [3] : shape.split('→').map(Number);
  const y = l => 54 - (l - 1) * 11.5; const xs = pts.length === 1 ? [50] : pts.map((_, i) => 14 + i * (72 / (pts.length - 1)));
  const d = pts.length === 1 ? `M 44 ${y(3)} L 56 ${y(3)}` : 'M ' + pts.map((p, i) => `${xs[i]} ${y(p)}`).join(' L ');
  const smooth = pts.length === 3 ? `M ${xs[0]} ${y(pts[0])} Q ${xs[1]} ${y(pts[1]) + 9} ${xs[2]} ${y(pts[2])}` : d;
  return `<svg viewBox="0 0 100 60" aria-hidden="true"><g class="grid">${[1, 2, 3, 4, 5].map(l => `<line x1="6" x2="94" y1="${y(l)}" y2="${y(l)}" stroke-width=".6"/>`).join('')}</g><path d="${smooth}" stroke="var(--t${n || 5})"/></svg>`;
}

  for (const w of shuffle(ws).slice(0, 12)) qs.push(anyQ(w));
  const gs = D.core.grammar.filter(g => g.lv === lv || (lv >= 5 && g.lv >= 5));
  const keys = [...new Set([...gs.flatMap(g => g.ex.filter(e => e.k >= 0).map(e => e.w[e.k])), ...PARTICLES])];
  const exs = shuffle(gs.flatMap(g => g.ex));
  for (const ex of exs.filter(e => e.k >= 0).slice(0, 5)) qs.push(qFill(ex, ex.k, keys));
  const ordSrc = [...exs, ...ws.filter(w => w.ex).map(w => w.ex)];
  for (const ex of shuffle(ordSrc)) { if (qs.length >= n) break; const q = qOrder(ex); if (q) qs.push(q); }
  while (qs.length < n && ws.length) qs.push(anyQ(ws[Math.floor(Math.random() * ws.length)]));
  return shuffle(qs);
}

let arenaUnsub = null, arenaRes = {}, arenaQuizOn = false, arenaStartT = 0;
function arenaQs(seed, lv, n, pool) {
  const rnd = mulberry32(seed);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const qs = [];
  const used = new Set();
  while (qs.length < n && used.size < pool.length) {
    const w = pick(pool); if (used.has(w.s)) continue; used.add(w.s);
    const kind = pick(['meaning', 'hanzi', 'pinyin']);
    const others = []; while (others.length < 3) { const x = pick(pool); if (x.s !== w.s && !others.includes(x) && x.vi !== w.vi) others.push(x); }
    if (kind === 'pinyin' && pyVariants(w.py).length >= 3) {
      const r2 = mulberry32(seed + qs.length); const vs = []; let guard = 0; while (vs.length < 3 && guard++ < 50) { const v = pyVariants(w.py)[Math.floor(r2() * 3)]; if (v && !vs.includes(v)) vs.push(v); }
      if (vs.length === 3) { qs.push({ type: 'mcq', ask: 'Chọn pinyin đúng', prompt: `<div class="big-han">${esc(w.s)}</div>`, opts: shuffle([w.py, ...vs], rnd).map(p => ({ v: p, h: `<span class="py" style="font-size:18px">${esc(p)}</span>` })), a: w.py, two: true, w }); continue; }
    }
    if (kind === 'hanzi') qs.push({ type: 'mcq', ask: 'Chọn chữ Hán đúng', prompt: `<div class="vi-big">${esc(w.vi)}</div>`, opts: shuffle([w, ...others], rnd).map(x => ({ v: x.s, h: `<span class="han">${esc(x.s)}</span>` })), a: w.s, two: true, w });
    else qs.push({ type: 'mcq', ask: 'Chọn nghĩa đúng', prompt: `<div class="big-han">${esc(w.s)}</div>`, opts: shuffle([w, ...others], rnd).map(x => ({ v: x.s, h: esc(x.vi) })), a: w.s, w });
  }
  return qs;
}
function watchArena() {
  if (arenaUnsub) { arenaUnsub(); arenaUnsub = null; }
  arenaRes = {};
  const ar = S.arena; if (!ar || !ar.id || !S.cap.db) return;
  arenaUnsub = S.cap.db.collection('matches/' + ar.id + '/r').onSnapshot(snap => {
    arenaRes = {}; snap.docs.forEach(d => arenaRes[d.id] = d.data());
    if (S.view === 'arena') render({ keepScroll: true });
    arenaMaybeFinish();
  }, () => { });
}

};

  const rows = joined.map(u => ({ u, ...arenaRes[u] })).sort((a, b) => b.score - a.score || (a.done && b.done ? a.t - b.t : 0));
  const left = ar.state === 'play' ? Math.max(0, Math.ceil((ar.startAt - Date.now()) / 1000)) : 0;
  return {

ACT.arenaplay = async () => {
  const ar = S.arena; if (!ar || arenaQuizOn) return;
  const pool = await wordPool(ar.lv);
  const qs = arenaQs(ar.seed, ar.lv, ar.n, pool.length > 30 ? pool : [...BYLV[1], ...BYLV[2]]);
  arenaQuizOn = true; const t0 = Math.max(Date.now(), ar.startAt);

  startQuiz(qs, {
    title: 'Đấu trường', fast: true,
    onAnswer: (q, ok) => { st = { ...st, score: st.score + (ok ? 1 : 0), q: st.q + 1 }; schedule(path, () => st, 250); },
    onDone: (sc, Qz) => { st = { ...st, score: Qz.ok, q: ar.n, done: true, t: Date.now() - t0 }; schedule(path, () => st, 50); arenaQuizOn = false; return 0; },
    onQuit: () => { arenaQuizOn = false; st = { ...st, done: true, t: Date.now() - t0 + 99999 }; schedule(path, () => st, 50); },
    onExit: () => go('arena', {}, { replace: true }),

function arenaMaybeFinish() {
  const ar = S.arena; if (!ar || ar.state !== 'play') return;
  const rs = Object.values(arenaRes); const allDone = rs.length && rs.every(r => r.done);

function arenaSettle() {

  }, () => { });
  db.collection('msgs').orderBy('at', 'desc').limit(50).onSnapshot(snap => {
    S.msgs = snap.docs.map(d => d.data()).filter(m => m && m.t).reverse();
    if (S.view === 'group') { const m = $('#msgs'); if (m) { m.innerHTML = msgsHTML(); m.scrollTop = m.scrollHeight; } LS.set('seenMsg', Date.now()); }
    updateDots();
  }, () => { });
  db.doc('meet/current').onSnapshot(s => { S.meet = s.exists ? s.data() : null; if (S.view === 'group') render({ keepScroll: true }); }, () => { });
  db.doc('arena/live').onSnapshot(s => {
    const prev = S.arena; S.arena = s.exists ? s.data() : null;
    if (!prev || !S.arena || prev.id !== S.arena.id) watchArena();
    if (S.arena && S.arena.state === 'done') arenaSettle();
    if (S.view === 'arena' || (S.view === 'group' && (!prev || !S.arena || prev.state !== S.arena.state))) render({ keepScroll: true });
    if (S.arena && S.arena.state === 'play' && prev && prev.state === 'lobby' && arenaRes[u] && S.view !== 'quiz') go('arena');
    updateDots();
  }, () => { });
  watchDuels();
  db.doc('srs/' + u).onSnapshot(s => { if (!s.exists || s.metadata.hasPendingWrites) return; const d = s.data(); if (d && d.cards && mergeSrs(d.cards)) updateDots(); }, () => { });
  db.doc('progress/' + u).onSnapshot(s => {
    if (!s.exists || s.metadata.hasPendingWrites) return; const r = s.data(); if (!r) return;
    if (mergeProgress(r)) { savePub(); updateTop(); if (['home', 'learn', 'track', 'review'].includes(S.view)) render({ keepScroll: true }); }
  }, () => { });
  if (S.cap.room) {
    const room = S.cap.room;
    room.presence({ u, name: S.me.name, av: S.me.av }).catch(() => { });
    room.onPeers(ch => { S.presence = ch.peers.filter(p => p.kind === 'viewer'); if (S.view === 'group') { const b = $('#board'); if (b) b.innerHTML = boardRows(); } }, () => { });
  }
}
async function enterAs(u, isNew) {
  const a = S.accounts[u]; if (!a) { S.view = 'auth'; return render(); }
  S.me = { u, name: a.name, av: a.av };
  $('#view').innerHTML = '<div class="splash"><div class="mark">汉</div><p class="muted">Đang mở sổ học…</p></div>';
  let [prog, srs, pub] = await Promise.all([readDoc('progress/' + u), readDoc('srs/' + u), readDoc('players/' + u)]);
  if (!S.local) { prog = prog || LS.get('doc:progress/' + u, null); srs = srs || LS.get('doc:srs/' + u, null); }
  const dp = defaultProg();
  S.P = Object.assign(dp, prog || {}); S.P.settings = Object.assign(defaultProg().settings, (prog && prog.settings) || {});
  S.srs = (srs && srs.cards) || {};
  S.pub = Object.assign(defaultPub(S.me), pub || {}); S.pub.name = a.name; S.pub.av = a.av; if (!S.pub.blitz) S.pub.blitz = { best: 0, wk: {} };
  // dữ liệu cũ: phần XP chưa có trong lịch sử theo ngày được giữ lại ở xpBase
  const sumDaily = Object.values(S.P.daily || {}).reduce((a, b) => a + b, 0);
  if ((S.pub.xp || 0) > sumDaily + (S.P.xpBase || 0)) S.P.xpBase = S.pub.xp - sumDaily;
  if (S.local === false) { const cached = LS.get('doc:progress/' + u, null); if (cached && cached !== prog) mergeProgress(cached); }
  derivePub(); AIC = null;
  if (!pub) savePub();
  if (!prog) saveProg();
  if (S.P.level >= 3) ensureUpper().catch(() => { });
  startLive();
  const hv = (location.hash || '').slice(1);
  const jump = !isNew && ['learn', 'review', 'ai', 'group'].includes(hv) ? hv : null;
  if (hv) try { history.replaceState(null, '', location.pathname + location.search); } catch { }
  S.stack = []; S.tab = jump || (isNew ? 'learn' : 'home'); S.view = S.tab; render();
  if (isNew) toast('Chào mừng ' + a.name + '! Làm bài kiểm tra đầu vào để biết nên bắt đầu từ đâu.', 4000);
}
async function boot() {
  document.documentElement.lang = 'vi';
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'ai-in') { e.preventDefault(); ACT.aisend(); } });
  document.addEventListener('pointerdown', () => TTS.unlock(), { capture: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
  window.addEventListener('pagehide', flushAll);
  TTS.init();
  try { D.core = await loadJSON('data/core.json'); }
  catch (e) { $('#view').innerHTML = `<div class="splash"><div class="mark">汉</div><p>Không tải được dữ liệu bài học. Kiểm tra kết nối mạng rồi tải lại trang.</p></div>`; return; }
  buildCore();
  const cfg = window.HN_CONFIG;
  if (cfg && window.HNP) return bootFB(cfg);
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    const names = ['db', 'user', 'sample', 'room'];
    const got = await Promise.all(names.map(n => c.use(n).catch(() => null)));
    names.forEach((n, i) => S.cap[n] = got[i]);
  }
  if (S.cap.user) { try { S.cid = await S.cap.user.id(); S.isOwner = await S.cap.user.isOwner(); } catch { } }
  S.local = !S.cap.db;
  if (S.local) S.accounts = LS.get('localAccounts', {});
  else await subscribeAccounts();
  const sess = LS.get('session');
  let u = null;
  if (sess && S.accounts[sess.u] && S.accounts[sess.u].pin === sess.k) u = sess.u;
  else if (S.cid) u = Object.keys(S.accounts).find(k => S.accounts[k].cid === S.cid) || null;
  if (u) await enterAs(u);
  else { S.view = 'auth'; render(); }
}
boot();

/* ================= KHỞI ĐỘNG – bản web độc lập ================= */
function setupNeeded(msg) {
  S.view = 'setup'; S.setupMsg = msg; render();
}
VIEWS.setup = () => ({
  noTabs: true, title: 'Hán Ngữ Cùng Nhau', html: `<div class="splash" style="min-height:60vh"><div class="mark">汉</div><h1>Trang học chưa được cấu hình</h1>
    <p class="muted">${esc(S.setupMsg || '')}</p><a class="btn primary" href="setup.html">Xem hướng dẫn cài đặt</a></div>`
});
async function bootFB(cfg) {
  S.mode = 'fb'; S.local = false;
  if (!cfg.firebase || !cfg.firebase.apiKey || /DIEN_|YOUR_/.test(cfg.firebase.apiKey)) return setupNeeded('Chủ nhóm cần tạo dự án Firebase miễn phí và dán cấu hình vào tệp config.js.');
  try { HNP.init(cfg.firebase, cfg.test || {}); }
  catch (e) { return setupNeeded('Cấu hình Firebase không hợp lệ: ' + (e.message || e)); }
  Object.assign(S.cap, HNP.caps());
  S.groupErr = '';
  try { S.group = await HNP.groupInfo(); }
  catch (e) { S.group = null; S.groupErr = e && e.code === 'invalid_argument' ? 'Máy chủ từ chối truy cập. Chủ nhóm cần dán Luật bảo mật (Rules) vào Firestore theo hướng dẫn.' : 'Chưa kết nối được máy chủ của nhóm. Kiểm tra mạng, hoặc chủ nhóm kiểm tra Firestore đã được tạo chưa.'; }
  if (!S.group) authMode = 'register';
  let started = false;
  HNP.onAuth(async u => {
    if (u) {
      if (S.registering) return;
      if (S.me && S.me.u === u.uid) return;
      await afterAuthFB(u.uid);
    } else {
      if (started && S.me) { location.reload(); return; }
      S.me = null; fbBusy = false; S.view = 'auth'; render();
    }
    started = true;
  });
}
async function afterAuthFB(uid) {
  $('#view').innerHTML = '<div class="splash"><div class="mark">汉</div><p class="muted">Đang mở sổ học…</p></div>';
  const acc = await HNP.account(uid);
  if (!acc) { await HNP.logout(); fbBusy = false; authErr = 'Tài khoản này chưa thuộc nhóm (có thể đã bị chủ nhóm xoá). Hãy đăng ký lại bằng mã mời.'; S.view = 'auth'; return render(); }
  HNP.watchSecret(sec => {
    const had = !!(S.secret && S.secret.geminiKey);
    S.secret = sec; S.isOwner = !!(sec && sec.owner === uid);
    if (S.view === 'ai' && had !== !!(sec && sec.geminiKey)) render({ keepScroll: true });
  });
  await subscribeAccounts();
  if (!S.accounts[uid]) S.accounts[uid] = acc;
  try { S.group = await HNP.groupInfo(); } catch { }
  const reg = S.justRegistered; S.justRegistered = null;
  await enterAs(uid, !!reg);
  if (reg && reg.first) setTimeout(() => toast(`Đã lập nhóm! Mã mời của nhóm: ${reg.invite} (xem lại trong Cài đặt).`, 7000), 600);
}

if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
